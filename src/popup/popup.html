<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scraping de Falabella</title>
    <link rel="stylesheet" href="/tailwind.css" />
  </head>
  <body>
    <div class="w-[360px] max-w-full">
      
      <div class="bg-white rounded-lg shadow p-4 mb-4 space-y-3">
        <div class="min-w-0">
          <h1 class="text-lg font-semibold text-gray-900">Comparador por Keyword</h1>
          <p class="mt-1 text-sm text-gray-500">Prueba rápida: ingresa keyword y lanza scraping por sitio.</p>
        </div>

        <div class="flex gap-2">
          <input id="keywordInput" class="flex-1 px-3 py-2 border rounded-md text-sm" placeholder="Ej: iphone 13" />
          <button id="clearButton" class="px-3 py-2 bg-gray-50 text-gray-700 text-sm font-medium rounded-md hover:bg-gray-100">Limpiar</button>
        </div>

        <div class="flex gap-2">
          <button id="btnFalabella" class="flex-1 px-3 py-2 bg-indigo-600 text-white text-sm font-medium rounded-md hover:bg-indigo-700">Buscar Falabella</button>
          <button id="btnML" class="flex-1 px-3 py-2 bg-yellow-500 text-white text-sm font-medium rounded-md hover:bg-yellow-600">Buscar ML</button>
        </div>
      </div>
      <div id="result" class="min-h-[120px]"></div>
      
    </div>

    <script type="module" src="/src/popup/popup.ts"></script>
  </body>
</html>
