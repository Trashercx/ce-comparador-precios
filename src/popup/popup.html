<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Comparador por Keyword</title>
    <link rel="stylesheet" href="/tailwind.css" />
  </head>
  <body>
    <div class="w-[360px] max-w-full p-3 space-y-3">
      <!-- Header -->
      <div class="bg-white rounded-lg shadow p-4 space-y-2">
        <h1 class="text-lg font-semibold text-gray-900">Comparador por Keyword</h1>
        <p class="text-sm text-gray-500">Guarda keywords y lanza scraping por sitio.</p>

        <div class="flex gap-2">
          <input
            id="keywordInput"
            class="flex-1 px-3 py-2 border rounded-md text-sm"
            placeholder="Ej: iphone 13"
          />
          <button
            id="addKeywordBtn"
            class="px-3 py-2 bg-indigo-600 text-white text-sm font-medium rounded-md hover:bg-indigo-700"
          >
            Agregar
          </button>
        </div>

        <div class="flex gap-2">
          <button
            id="refreshBtn"
            class="flex-1 px-3 py-2 bg-gray-50 text-gray-700 text-sm font-medium rounded-md hover:bg-gray-100"
          >
            Refrescar
          </button>
          <button
            id="clearViewBtn"
            class="px-3 py-2 bg-gray-50 text-gray-700 text-sm font-medium rounded-md hover:bg-gray-100"
          >
            Limpiar vista
          </button>
        </div>
      </div>

      <!-- List -->
      <div class="bg-white rounded-lg shadow p-3">
        <div class="flex items-center justify-between mb-2">
          <h2 class="text-sm font-semibold text-gray-800">Keywords</h2>
          <span id="keywordsCount" class="text-xs text-gray-500"></span>
        </div>

        <div id="keywordsList" class="space-y-2"></div>
      </div>

      <!-- Debug / Preview -->
      <div id="result" class="bg-white rounded-lg shadow p-3 text-xs text-gray-700 min-h-[80px]"></div>
    </div>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
